[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afterplay"
version = "0.1.0"
description = "Autonomous agent that turns long video into platform-native short clips"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2025.1.1",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "imageio-ffmpeg>=0.5",
    "openai>=1.50",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
asr = ["faster-whisper>=1.0"]
mcp = ["mcp[cli]>=1.2"]
all = ["anthropic>=0.40", "faster-whisper>=1.0", "mcp[cli]>=1.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
afterplay = "afterplay.cli:main"

[tool.setuptools.packages.find]
include = ["afterplay*"]

[tool.setuptools.package-data]
afterplay = ["skills/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
